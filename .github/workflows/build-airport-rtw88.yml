name: Build AirPort_RTW88 for Intel Ventura

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "AirPort_RTW88 branch, tag, or commit to build"
        required: true
        default: "main"
  push:
    paths:
      - ".github/workflows/build-airport-rtw88.yml"
      - "patches/**"

permissions:
  contents: read

concurrency:
  group: airport-rtw88-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel macOS runner is required because this project builds x86_64 kernel code.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out this research repository
        uses: actions/checkout@v4
        with:
          path: research

      - name: Check out upstream AirPort_RTW88
        uses: actions/checkout@v4
        with:
          repository: xnoah222/Airport_RTW88
          ref: ${{ inputs.upstream_ref || 'main' }}
          submodules: recursive
          path: AirPort_RTW88
          persist-credentials: false

      - name: Disable unsupported optional AWDL private-ABI ioctl payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 research/patches/disable-private-awdl-ioctl.py
          git -C AirPort_RTW88 diff --check
          git -C AirPort_RTW88 diff -- src/kext/AirportRTW88AWDL.cpp

      - name: Record source revisions and toolchain
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "airport_sha=$(git -C AirPort_RTW88 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "airport_short=$(git -C AirPort_RTW88 rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "runner_arch=$(uname -m)" 
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          git -C AirPort_RTW88 submodule status

      - name: Check out Linux rtw88 source dependency
        uses: actions/checkout@v4
        with:
          repository: thegwchr/rtw88-stable
          path: rtw88-stable
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch required Realtek firmware blobs
        working-directory: AirPort_RTW88
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "firmware/$fw" ]; then
              curl --fail --location --retry 3 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                --output "firmware/$fw"
            fi
            test -s "firmware/$fw"
          done
          shasum -a 256 firmware/*.bin

      - name: Generate missing native AirPort kext bundle metadata
        working-directory: AirPort_RTW88
        shell: bash
        run: |
          set -euo pipefail
          # Upstream Makefile references this bundle skeleton, but the current
          # upstream checkout does not contain it. Generate metadata from the
          # upstream class and kmod declarations rather than failing at make.
          mkdir -p AirPort_RTW88.kext/Contents
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = {
              "CFBundleDevelopmentRegion": "English",
              "CFBundleExecutable": "AirPort_RTW88",
              "CFBundleIdentifier": "com.rtw88.airport",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "AirPort_RTW88",
              "CFBundlePackageType": "KEXT",
              "CFBundleShortVersionString": "1.0.1",
              "CFBundleVersion": "1.0.1",
              "OSBundleRequired": "Root",
              "OSBundleLibraries": {
                  "com.apple.kernel": "20.0.0",
                  "com.apple.iokit.IOPCIFamily": "2.9",
                  "com.apple.iokit.IO80211Family": "1.0.0"
              },
              "IOKitPersonalities": {
                  "AirPort_RTW88-RTL8821CE": {
                      "CFBundleIdentifier": "com.rtw88.airport",
                      "IOClass": "AirportRTW88",
                      "IOProviderClass": "IOPCIDevice",
                      "IOPCIPrimaryMatch": "0xB82110EC 0xC82110EC",
                      "IOProbeScore": 1000
                  }
              }
          }
          target = Path("AirPort_RTW88.kext/Contents/Info.plist")
          target.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_XML, sort_keys=True))
          with target.open("rb") as f:
              plistlib.load(f)
          print(target)
          PY

      - name: Build x86_64 kext and control utility
        working-directory: AirPort_RTW88
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          make clean
          # Build the native AirPort bundle, not the legacy Ethernet-style rtw88 bundle.
          # The upstream Makefile's "all" target invokes "kext", which expects a
          # separate rtw88.kext skeleton absent from this repository.
          make airport
          make ctl
          test -d build/out/AirPort_RTW88.kext
          test -s build/out/AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88
          test -s build/out/rtw88ctl

      - name: Validate build outputs
        working-directory: AirPort_RTW88
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint AirPort_RTW88.kext/Contents/Info.plist
          file build/out/AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88
          lipo -info build/out/AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88
          dwarfdump --uuid build/out/AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88
          codesign -dv --verbose=2 build/out/AirPort_RTW88.kext 2>&1 || true
          shasum -a 256 build/out/AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88 build/out/rtw88ctl

      - name: Package build with provenance
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.airport_sha }}
          UPSTREAM_SHORT: ${{ steps.source.outputs.airport_short }}
        run: |
          set -euo pipefail
          mkdir -p package
          ditto AirPort_RTW88/build/out/AirPort_RTW88.kext package/AirPort_RTW88.kext
          cp AirPort_RTW88/build/out/rtw88ctl package/
          cat > package/BUILD-INFO.txt <<EOF
          Project: xnoah222/Airport_RTW88
          Upstream commit: $UPSTREAM_SHA
          Upstream short commit: $UPSTREAM_SHORT
          Runner: $(sw_vers -productVersion) / $(uname -m)
          Xcode: $(xcodebuild -version | tr '\n' ' ')
          macOS SDK: $(xcrun --sdk macosx --show-sdk-version)
          Build target: x86_64; Makefile minimum macOS target: 13.0
          Build commands: make clean; make airport; make ctl
          Note: Successful compilation does NOT prove the kext works on a particular laptop.
          EOF
          (cd package && shasum -a 256 rtw88ctl AirPort_RTW88.kext/Contents/MacOS/AirPort_RTW88 > SHA256SUMS)
          ditto -c -k --sequesterRsrc --keepParent package AirPort_RTW88-${UPSTREAM_SHORT}-x86_64.zip

      - name: Upload experimental build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPort_RTW88-${{ steps.source.outputs.airport_short }}-x86_64
          path: AirPort_RTW88-*-x86_64.zip
          if-no-files-found: error
          retention-days: 14
